packages:
  - .

# pnpm >= 11.28 defaults minimumReleaseAge to 1440 (24h) and then rejects
# lockfiles carrying freshly-published packages, breaking nuxt build / Vercel
# deploys right after upstream bumps.
minimumReleaseAge: 0

allowBuilds:
  '@parcel/watcher': true
  esbuild: true

# Upstream ships skewed intlify sets with no enabled CI to catch them
# (MISSING_EXPORT at build). Pin the interlocked train to one version -
# bump ALL FIVE together whenever upstream bumps vue-i18n.
overrides:
  'vue-i18n': 11.4.18
  '@intlify/shared': 11.4.18
  '@intlify/core-base': 11.4.18
  '@intlify/message-compiler': 11.4.18
  '@intlify/devtools-types': 11.4.18
