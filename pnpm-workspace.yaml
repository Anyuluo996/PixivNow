packages:
  - .

# pnpm >= 11.28 defaults this to 1440 (24h) and then rejects lockfiles
# carrying freshly-published packages, which breaks `nuxt build` (it runs
# an internal pnpm install) and Vercel deploys right after upstream bumps.
minimumReleaseAge: 0

allowBuilds:
  '@parcel/watcher': true
  esbuild: true

overrides:
  'vue-i18n': 11.4.12
  '@intlify/shared': 11.4.12
  '@intlify/core-base': 11.4.12
  '@intlify/message-compiler': 11.4.12
  '@intlify/devtools-types': 11.4.12
  '@intlify/core': 11.4.12
